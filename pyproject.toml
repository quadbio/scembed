[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "scembed"
description = "Run embedding comparisons for single-cell data"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Marius Lange", email = "mlange@ethz.ch" },
]
authors = [
  { name = "Marius Lange" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]

dependencies = [
  "numpy>=2.1",
  "pyarrow>=20",         # Required for parquet support in pandas
  "scanpy>=1.11.4",
  "scib-metrics>=0.5.6",
  "scipy>=1.16",         # Ensure compatibility with PyTorch tensors
  "session-info2",
  "wandb",
]

optional-dependencies.all = [
  "scembed[cpu,fast-metrics,gpu]",
]
optional-dependencies.cpu = [
  "pyliger>=0.2.4",
  "scanorama>=1.7.4",
]
optional-dependencies.fast-metrics = [
  "faiss-cpu",         # Fast nearest neighbors (GPU via rapids-singlecell)
  "rapids-singlecell", # GPU-accelerated single-cell analysis
]

optional-dependencies.gpu = [
  "harmony-pytorch", # GPU-accelerated Harmony
  "lightning",       # transitive via scvi-tools, declared here so the [tool.uv.sources] redirect applies
  "scarches>=0.6.1", # for scPoli
  "scvi-tools>=1.3",
  "torch>=2.8",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://scembed.readthedocs.io/"
urls.Homepage = "https://github.com/quadbio/scembed"
urls.Source = "https://github.com/quadbio/scembed"

[dependency-groups]
dev = [
  "pre-commit",
  "twine>=4.0.2",
]
test = [
  "coverage>=7.10",
  "h5py",           # for testing h5 format
  "pyarrow",        # for testing parquet format (already in main deps but explicit for tests)
  "pytest",
  "pytest-cov",     # For VS Code's coverage functionality
]
doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  # Until pybtex >0.24.0 releases: https://bitbucket.org/pybtex-devs/pybtex/issues/169/
  "setuptools",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]

[tool.hatch.version]
source = "vcs"

# Workaround: PyPI has quarantined the `lightning` distribution
# (https://pypi.org/simple/lightning/ -> project-status: quarantined, zero
# files). `scvi-tools` depends on `lightning>=2.0`, so any environment with
# the `[gpu]` extra fails to resolve. Pull `lightning` from the upstream
# GitHub monorepo instead until PyPI restores the package, then drop this
# block.
[tool.hatch.envs.default]
installer = "uv"
dependency-groups = [ "dev" ]

[tool.hatch.envs.docs]
dependency-groups = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

# Test the lowest and highest supported Python versions with stable deps
[[tool.hatch.envs.hatch-test.matrix]]
python = [ "3.11", "3.14" ]

[tool.hatch.envs.hatch-test]
features = [ "cpu", "gpu" ]
dependency-groups = [ "dev", "test" ]

[tool.uv.sources]
lightning = { git = "https://github.com/Lightning-AI/pytorch-lightning", tag = "2.6.2" }

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage.run]
source = [ "scembed" ]
patch = [ "subprocess" ]
omit = [
  "**/test_*.py",
]

[tool.cruft]
skip = [
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
